# Nixpacks configuration for Railway deployment
# This file tells Railway/Nixpacks how to build and run the application

[phases.setup]
nixPkgs = ["python311", "pip"]

[phases.install]
cmds = ["pip install -r requirements_production.txt"]

[start]
cmd = "python scripts/create_admin_on_startup.py && uvicorn app.main_production:app --host 0.0.0.0 --port $PORT"
